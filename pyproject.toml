[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pi-generator"
version = "0.1.0"
description = "Auto-PI Research Scaffold"
authors = [{name = "AutoPI", email = "auto@pi.org"}]
requires-python = ">=3.11,<3.13"
dependencies = [
    "arxiv>=2.4.0",
    "pandas>=2.3.3",
    "pydantic>=2.8",
    "pyalex>=0.21",
    "pyyaml>=6.0",
    "requests>=2.32.5",
    "tenacity>=9.1.4",
]

[project.scripts]
autopi = "autopi_engine.cli:main"

[project.optional-dependencies]
geospatial = [
    "geopandas>=1.1.2",
    "osmnx>=2.1.0",
    "networkx>=3.0",
    "shapely>=2.0",
    "pyogrio>=0.9",
]
vision = [
    "pillow>=10.0",
    "opencv-python-headless>=4.9",
    "transformers>=4.40",
]
deepvision = [
    "torch",
    "segment-anything",
]
[tool.setuptools.packages.find]
include = ["autopi_engine*", "agents*", "models*"]

[tool.pytest.ini_options]
testpaths = ["tests/skill_runtime"]
markers = [
    "live_openalex: marks tests that call the real OpenAlex API (require OPENALEX_API_KEY, OPENALEX_EMAIL, pyalex)",
    "slow: marks tests that run the full pipeline or are otherwise slow (>10s); excluded from default run",
]
addopts = "-m 'not slow and not live_openalex'"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
]
